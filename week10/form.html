<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form.html</title>
    <link rel="stylesheet" href="css/form.css">
</head>

<body>
    <div class="container">
        <div class="container-top">
            <form>
                <input type="radio" id="html" name="fav_language" value="HTML">
                <label for="html">one player</label>
                <input type="radio" id="css" name="fav_language" value="CSS">
                <label for="css">siblings</label>
            </form>
            <img src="img/cross.svg" class="icon" alt="close">
        </div>
        <div class="input-form">
            <h2>Registration Form - Middle School</h2>
            <form>
                <input type="radio" id="player1" name="fav_language" value="HTML">
                <label for="player1">player 1</label>
                <input type="radio" id="player2" name="fav_language" value="CSS">
                <label for="player2">player 2</label>
            </form>
            <div class="input-section">
                <input type="text" class="input-box" id="fname" name="fname" value="" placeholder="First Name*">
                <input type="text" class="input-box" id="lname" name="lname" value="" placeholder="Last Name*">
                <input type="text" class="input-box" id="grade=level" name="grade=level" value=""
                    placeholder="Grade level*">
                <input type="text" class="input-box" id="school" name="school" value="" placeholder="School Attending*">
                <input type="text" class="input-box" id="skill-level" name="skill-level" value=""
                    placeholder="Skill Level*">
                <input type="text" class="input-box" id="tshirt" name="tshirt" value="" placeholder="T-Shirt Size*">
                <input type="text" class="input-box" id="email" name="email" value="" placeholder="Email*">
                <input type="text" class="input-box" id="email-confirm" name="email-confirm" value=""
                    placeholder="Confirm Email*">

            </div>
        </div>
    </div>

</body>

</html>
