<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Sample</title>
    <link rel="stylesheet" href="../common/button.css">
    <link rel="stylesheet" href="../common/variables.css">

</head>

<body>
    <div class="card">
        <h1>Button</h1>
        <div class="btn btn_cyan btn_fontwhite btn_icon_white hover_yellow">
            <a href="https://google.com">Our School</a>
        </div>
        <div class="btn btn_transparent_white btn_text_trans_white btn_icon_white hover_beige hover_text_dark">
            <a href="https://google.com">View Events</a>
        </div>
        <div class="btn btn_cyan btn_fontwhite icon_white hover_dark_blue">
            <a href="https://google.com">View All Events</a>
        </div>
        <div class="btn btn_yellow btn_fontblack btn_icon_black hover_dark_blue">
            <a href="https://google.com">Apply for Enrollment</a>
        </div>
        <div class="btn btn_transparent btn_fontblack btn_icon_black hover_cyan">
            <a href="https://google.com">View All Courses</a>
        </div>
        <div class="btn btn_course btn_fontblack btn_icon_black hover_dark_blue">
            <a href="https://google.com">Course Detail</a>
        </div>
        <div class="btn btn_yellow btn_fontblack btn_icon_black hover_cyan">
            <a href="https://google.com">Take A Virtual Tour</a>
        </div>
        <div class="btn btn_dark_blue btn_fontwhite btn_icon_white hover_yellow">
            <a href="https://google.com">Program FAQ's</a>
        </div>
        <div class="btn btn_cyan btn_fontwhite hover_yellow">
            <a href="https://google.com">Update</a>
        </div>
        <div class="small_btn btn_yellow">
            <span>WHO ARE WE</span>
        </div>
        <div class="academic_btn btn_purple hover_green>">
            <span>ELEMENTARY</span>
        </div>
        <div class="small_btn btn_transparent_blue hover_transparent">
            <span>SCHOOL FOUNDATION</span>
        </div>
    </div>



</body>

</html>
