<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Sample</title>
    <script src="https://kit.fontawesome.com/f5bc9a978a.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../common/header.css">
    <link rel="stylesheet" href="../common/variables.css">

</head>

<body>
    <div class="header">
        <div class="header_icon">
            <img src="../../img/logo.png" alt="Header Icon" width="190px">
        </div>
        <div class="header_menu">
            <div class="menu">Home</div>

            <div class="menu arrow_down">Academics
                <div class="academics_menu">
                    <div class="acadamic_submenu">
                        <div class="school_padding elementary">
                            <div>
                                <h5><a href>Elementary School</a></h5>
                            </div>
                            <div>
                                <p>For Grades K-5</p>
                            </div>
                        </div>
                        <div class="school_padding middle">
                            <div>
                                <h5><a href>Middle School</a></h5>
                            </div>
                            <div>
                                <p>For Grades 6-8</p>
                            </div>
                        </div>
                        <div class="school_padding high">
                            <div>
                                <h5><a href>High School</a></h5>
                            </div>
                            <div>
                                <p>For Grades 9-12</p>
                            </div>
                        </div>
                    </div>
                    <div class="online">
                        <div class="school_padding online_school">
                            <div class="online_school_content">
                                <div>
                                    <h5>Leading Online School</h5>
                                </div>
                                <div>
                                    <p>Sollicit eudin egestas blandit lectus vitae diam. Integer tempore nuncka.</p>
                                </div>
                            </div>
                            <div class="linkpic"><a href>View Courses</a><img src="../../img/online_school.png"
                                    alt="online" width="165px"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="menu">Events</div>
            <div class="menu arrow_down">Info
                <div class="info_menu">
                    <div class="info"><a href>School</a></div>
                    <div class="info"><a href>Academics</a></div>
                    <div class="info"><a href>Program & Courses</a></div>
                </div>
            </div>
            <div class="menu">News</div>
        </div>

        <div class="header_bottom">
            <div><button class="top_header_btn"><a class="btn_header_color" href="">Enrol Today</a></button></div>
            <div class="bento_menu" id="bento_menu"><img src="../../img/bento-menu.svg" alt="bento_menu" width="20px">
            </div>
            <div><img src="../../img/cart.png" alt="Cart" width="20px"></div>
        </div>
    </div>

</body>

</html>
